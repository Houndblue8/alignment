<!doctype html>
<html lang="en" data-theme="gold-cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alignment" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Alignment</title>
    <style>
      /* Page background per theme, painted before any script or stylesheet loads (no flash). */
      html, body { background: #fbf7ee; margin: 0; }
      html[data-theme='sakura'], html[data-theme='sakura'] body { background: #fff6f8; }
      html[data-theme='ocean'], html[data-theme='ocean'] body { background: #f1f7fa; }
      html[data-theme='forest-ember'], html[data-theme='forest-ember'] body { background: #f3f5ec; }
      html[data-theme='black-gold'], html[data-theme='black-gold'] body { background: #0b0b0c; }
      html[data-theme='black-panther'], html[data-theme='black-panther'] body { background: #09080d; }
    </style>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('alignment.theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
