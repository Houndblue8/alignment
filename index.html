<!doctype html>
<html lang="en" data-theme="gold-cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alignment" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Alignment</title>
    <style>
      /* Page background per theme, painted before any script or stylesheet loads (no flash). */
      html, body { background: #fbf7ee; margin: 0; }
      html[data-theme='sakura'], html[data-theme='sakura'] body { background: #fff6f8; }
      html[data-theme='ocean'], html[data-theme='ocean'] body { background: #f1f7fa; }
      html[data-theme='forest-ember'], html[data-theme='forest-ember'] body { background: #f3f5ec; }
      html[data-theme='black-gold'], html[data-theme='black-gold'] body { background: #0b0b0c; }
      html[data-theme='black-panther'], html[data-theme='black-panther'] body { background: #09080d; }

      /* The loading screen (Oct 16): the fire, Alignment over its head, three little fires hopping around it. */
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px; color: #3a2f22; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      html[data-theme='black-gold'] .boot, html[data-theme='black-panther'] .boot { color: #f4ead8; }
      .boot-title { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: 0.02em; }
      .boot-fire { width: min(64vw, 260px); height: auto; overflow: visible; }
      .boot-main { transform-box: fill-box; transform-origin: 50% 100%; animation: boot-flicker 1.6s ease-in-out infinite alternate; }
      .boot-hop { transform-box: fill-box; transform-origin: 50% 100%; animation: boot-hop 1.2s ease-in-out infinite; }
      .boot-hop.h1 { animation-delay: 0.4s; }
      .boot-hop.h2 { animation-delay: 0.8s; }
      @keyframes boot-flicker { from { transform: scale(1, 1); } to { transform: scale(0.96, 1.05) skewX(1.5deg); } }
      @keyframes boot-hop { 0%, 100% { transform: translate(0, 0) scale(1, 1); } 12% { transform: translate(0, 0) scale(1.12, 0.86); } 45% { transform: translate(0, -26px) scale(0.94, 1.06); } 70% { transform: translate(0, 0) scale(1.06, 0.94); } }
      @media (prefers-reduced-motion: reduce) { .boot-main, .boot-hop { animation: none; } }
    </style>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('alignment.theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
